<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080706" />
    <meta name="description" content="EscapeApp — escape room cinematografiche interattive." />
    <title>EscapeApp</title>
    <style>
      html,body,#root{min-height:100%;margin:0;background:#080706;color:#eadfce}
      body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#231b16 0,#080706 55%)}
      .boot-card{width:min(520px,100%);padding:30px;border:1px solid rgba(226,198,162,.18);background:rgba(12,10,9,.88);box-shadow:0 30px 100px #000;text-align:center}
      .boot-card small{letter-spacing:.22em;color:#9e8873}
      .boot-card h1{margin:12px 0;font-family:Georgia,serif;letter-spacing:.12em}
      .boot-card p{line-height:1.6;color:#c7b8a8}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-card">
          <small>ESCAPEAPP</small>
          <h1>CARICAMENTO</h1>
          <p>L’esperienza si sta preparando. Se questa schermata rimane visibile, GitHub Pages deve essere configurato per pubblicare tramite GitHub Actions.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
